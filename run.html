<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Runner</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #1e293b;
            margin-top: 0;
            text-align: center;
        }
        .instructor-note {
            background-color: #e2e8f0;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        /* Estilos del editor CodeMirror */
        .CodeMirror {
            border-radius: 8px;
            font-size: 16px;
            height: 300px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn-ejecutar {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 15px 0;
            transition: background 0.2s;
            display: block;
            width: 100%;
        }
        .btn-ejecutar:hover {
            background-color: #059669;
        }
        /* Consola de salida */
        .output-box {
            background-color: #0f172a;
            color: #38bdf8;
            font-family: 'Fira Code', 'Courier New', monospace;
            padding: 15px;
            border-radius: 8px;
            min-height: 120px;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
    <h1>Snake Runner (Python)</h1>
    <!-- <div class="instructor-note">
        
    </div> -->

    <textarea id="codigo-alumno"># Introduce el codigo abajo
        
</textarea>

    <button class="btn-ejecutar" onclick="correrPython()">Ejecutar</button>

    <h3>Resultado de la Consola:</h3>
    <div id="consola-salida" class="output-box"></div>
</div>

<script type="module">
    let runtimePython;

    document.addEventListener('py-ready', () => {
        runtimePython = document.querySelector('script-py')._py.next;
    });

    window.correrPython = async function() {
        const codigo = window.editor.getValue();
        const salidaDiv = document.getElementById("consola-salida");
        
        salidaDiv.style.color = "#38bdf8";  // cian
        salidaDiv.innerText = "Ejecutando...";

        if (!runtimePython) {
            salidaDiv.style.color = "#eab308"; // amarillo
            salidaDiv.innerText = "El entorno de Python aún se está descargando. Por favor, espera unos segundos e intenta de nuevo.";
            return;
        }

        const pyExtension = document.querySelector('script-py') || await queryPyScript();
            
        // Usamos una función nativa de JavaScript para evaluar el código Python mediante PyScript
        const pyscriptCore = await import("https://pyscript.net/releases/2024.1.1/core.js");

        try {
            const codigoModificado = `
import sys
from io import StringIO
sys.stdout = StringIO()

# Código real escrito por el alumno
${codigo}

# Retornamos el contenido acumulado en el buffer
sys.stdout.getvalue()
`;
            const interprete = await kernel;
            const resultado = await runtimePython.runPythonAsync(codigoModificado);
            
            salidaDiv.innerText = resultado.trim() || "El código se ejecutó con éxito (sin salidas de texto).";
            
        } catch (error) {
            salidaDiv.style.color = "#ef4444";  // rojo
            salidaDiv.innerText = "Error en el código de Python:\n" + error.message;
        }
    };

    let kernel = new Promise((resolve) => {
        document.addEventListener("py-ready", (e) => {
            // Espera a PyScript
        });
    });
</script>

<script>
    // Inicializar CodeMirror sobre nuestro textarea
    window.editor = CodeMirror.fromTextArea(document.getElementById("codigo-alumno"), {
        mode: "python",
        theme: "dracula",
        lineNumbers: true,
        indentUnit: 4,
        matchBrackets: true
    });
</script>

<script-py style="display:none;"></script-py>

</body>
