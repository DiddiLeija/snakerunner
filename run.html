<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Runner</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .editor-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #555;
        }
        #output {
            background-color: #1e1e1e;
            color: #76c7c0;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 6px;
            min-height: 100px;
            white-height: pre-wrap;
            overflow-y: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .loading-msg {
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Mi IDE de Python en la Web</h1>
    <p class="loading-msg">Nota: La primera vez puede tardar unos segundos mientras el navegador descarga el entorno Python (WASM).</p>

    <div class="editor-container">
        <label for="codigo">Escribe tu código Python aquí:</label>
        
        <script-py terminal id="mi-editor">
# Introduce codigo aqui
        </script-py>
    </div>

    <label>Consola / Salida del código:</label>
    <div id="output"></div>

    <script>
    </script>
</body>
</html>
